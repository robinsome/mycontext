name: verify

# 为什么需要 CI：门禁全靠开发者手跑 `pnpm verify` 时，
# 「我本机是绿的」与「仓库是绿的」会逐渐分叉 —— 尤其是包数 7→14、
# 测试文件 13→~50 的规模下，没有机制能保证新包带测试、新包注册进 3 份清单。
#
# 刻意只跑 hermetic 的那部分：test:externals 需要 opencode / dws / kl，
# 在 CI 上必然不可用，把它放进来只会得到一条长期红的流水线（然后所有人忽略它）。
#
# 双平台：macos-14（与本机 darwin-arm64 开发线对齐）+ windows-latest（AMD64，
# 覆盖 win 路径/原生模块/prepare:bin）。fail-fast:false —— 一边红不该淹没另一边。
#
# ★ 文件名用 ci.yml：旧 verify.yml 在 fork 上被标成 workflow state=deleted，
# API 无法再 enable；换路径等于注册新工作流。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Windows runner 默认 pwsh；统一 bash 避免 $GITHUB_OUTPUT / 路径写法分叉。
        shell: bash

    steps:
      # Windows runner 默认 autocrlf=true，checkout 会把仓内 LF 变成 CRLF，
      # 随后 prettier --check 对几乎所有文件报错。打包流已对 forge 单独纠；
      # verify 全仓走 Prettier，必须在 checkout 前关掉转换。
      - name: Force LF checkouts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # ★ action 运行时升到 Node 24（@v4 仍声明 node20，会触发 deprecated 注解）。
      # 业务 Node 仍由 .nvmrc（22.x）决定，与这里无关。
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 二进制内置的验收之一：新克隆零配置就能准备好（按 runner 平台解析）。
      - run: pnpm prepare:bin

      - run: pnpm verify

      # 覆盖率只对确定性包设下限（见 vitest.config.ts 的注释）。
      - run: pnpm coverage

      # ★ 必须真的构建一次，否则 check:desktop-bundle 只会走"产物不存在→跳过"分支。
      #
      # 这一步对应一个真实故障：主进程新增的 4 个工作区包没进 electron-vite 的
      # 内联清单，产物里留下裸 import，运行时解析到无 dist 的 src/index.ts
      # → `pnpm dev` 启动即崩，而当时 `pnpm verify` 全绿（没有测试加载产物）。
      #
      # 放在 coverage 之后：build 会把 better-sqlite3 重建成 Electron ABI，
      # 而 vitest 需要 Node ABI —— 顺序颠倒会让 coverage 一步崩在原生模块上。
      - run: pnpm build

      - run: pnpm check:desktop-bundle
