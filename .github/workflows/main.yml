name: Build and Release Desktop App

# macOS arm64 发版包。路径约定见 apps/desktop/electron-builder.yml：
# 所有 from/files/output 相对**仓库根**；必须从仓库根调 electron-builder，
# 并显式传 --config。在 apps/desktop 下 `pnpm --filter … exec` 会把
# projectDir 当成 apps/desktop，产出叠成 apps/desktop/apps/desktop/release，
# asar 入口 apps/desktop/out/main/index.js 也找不到（run 33280873242 实测）。
#
# 产物：`dir`（yml 默认） alone 不会进 Artifacts/Releases 可下文件；
# CI 显式打 `dmg`，再 upload-artifact + `--publish always`（写 GitHub Release）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        os: [macos-14]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与本地 `pnpm dist:mac` 同序：Electron ABI 重建 → bin → 压平 Python → vite。
      - name: Build app (native + resources + vite)
        run: pnpm run build:app

      # ★ 必须在仓库根执行，并带 --config；不要用 filter exec（见文件头）。
      # `--mac dmg` 覆盖 yml 里仅 `dir` 的 target，产出可下载的 .dmg。
      - name: Package Desktop Application
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          pnpm exec electron-builder
          --mac dmg --arm64
          --publish always
          --config apps/desktop/electron-builder.yml

      # 与 package-windows-x64 对称：跑完就能在 Actions 页下载，不依赖 Release。
      - name: Upload macOS arm64 packages
        uses: actions/upload-artifact@v7
        with:
          name: MyContext-macos-arm64
          path: apps/desktop/release/**
          if-no-files-found: error
          retention-days: 14
