name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*' # 当推送以 v 开头标签时触发（例如 v1.0.0）
  workflow_dispatch: # 允许在 Actions 页面手动点击按钮触发测试打包

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-14 为 GitHub 官方提供的 Apple Silicon (M1/M2/M3/M4) 运行节点
        os: [macos-14]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm 10.x
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22.17.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Rebuild Native Modules (SQLite)
        # 为 macOS ARM64 架构重新编译 SQLite 等原生模块
        run: pnpm --filter @mycontext/desktop exec electron-builder install-app-deps --arch=arm64

      - name: Build Web Frontend Assets
        run: pnpm --filter @mycontext/desktop build

      - name: Package Desktop Application
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 针对 macOS ARM64 进行编译打包并发布
        run: pnpm --filter @mycontext/desktop exec electron-builder --mac --arm64 --publish always
