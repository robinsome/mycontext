name: Build and Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14]

    steps:
      # ★ action 运行时升到 Node 24（@v4 仍声明 node20）。
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Rebuild Native Modules (SQLite)
        run: pnpm --filter @mycontext/desktop exec electron-builder install-app-deps --arch=arm64

      - name: Build Web Frontend Assets
        run: pnpm --filter @mycontext/desktop build

      - name: Package Desktop Application
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @mycontext/desktop exec electron-builder --mac --arm64 --publish always
