name: package-windows-x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # 与 verify 相同：先关 autocrlf，再 checkout，避免整树 CRLF。
      - name: Force LF checkouts
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # ★ action 运行时升到 Node 24（@v4 / upload-artifact@v5 仍是 node20）。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preserve Forge integrity bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git checkout -- vendor/forge

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # kl 需要 Windows 原生 Python + 依赖；脚本会下载、校验并准备 venv。
      - name: Prepare Windows Python runtime
        run: pnpm setup:python

      - name: Build Windows x64 packages
        run: pnpm dist:win

      - name: Upload Windows x64 packages
        uses: actions/upload-artifact@v7
        with:
          name: MyContext-windows-x64
          path: apps/desktop/release/**
          if-no-files-found: error
          retention-days: 14
