name: package-windows-x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # 发版 tag 走「Build and Release Desktop App」矩阵（含 windows-latest），
    # 这里不再跟 tag，避免 Windows 打两遍。

# dist:win 固定 `--dir`（交叉打包用）；CI 在 Windows 真机上再打
# nsis/portable，与 mac 工作流显式打 dmg 同一思路。`--publish always`
# 需要写 Releases，故 contents: write。
permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # 与 verify 相同：先关 autocrlf，再 checkout，避免整树 CRLF。
      - name: Force LF checkouts
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      # ★ action 运行时升到 Node 24（@v4 / upload-artifact@v5 仍是 node20）。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preserve Forge integrity bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git checkout -- vendor/forge

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # kl 需要 Windows 原生 Python + 依赖；脚本会下载、校验并准备 venv。
      - name: Prepare Windows Python runtime
        run: pnpm setup:python

      # 先产出 win-unpacked（含 win better-sqlite3 换装；Windows 上不还原 Node ABI）。
      - name: Build Windows x64 unpacked
        run: pnpm dist:win

      # nsis/portable 会再从 node_modules 打包 .node；ABI 必须仍是 Electron。
      - name: Assert better-sqlite3 Electron ABI
        run: node scripts/assert-better-sqlite3-electron.mjs

      # 再用 windows 专用 yml 打可下载安装包，并写入 GitHub Release。
      # 不用 -c.npmRebuild=false：PowerShell 会把它拆成 -c + .npmRebuild=false
      #（run 33285071332 实测 ENOENT）；npmRebuild 写在 windows.yml 里。
      - name: Package installers (nsis + portable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: "false"
        run: >
          pnpm exec electron-builder
          --win nsis portable --x64
          --publish always
          --config apps/desktop/electron-builder.windows.yml

      - name: Upload Windows x64 packages
        uses: actions/upload-artifact@v7
        with:
          name: MyContext-windows-x64
          path: apps/desktop/release/**
          if-no-files-found: error
          retention-days: 14
